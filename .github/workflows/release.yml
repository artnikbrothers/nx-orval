# Publishes nx-orval to npm with trusted publishing (OIDC): no npm token is stored anywhere.
#
# Flow: `npx nx release <version>` runs on a maintainer machine. It bumps the version,
# updates CHANGELOG.md, commits, tags v<version>, pushes and creates the GitHub release.
# Pushing the tag starts this workflow, which builds that exact tag and publishes the
# built package with provenance. "Run workflow" repeats the publish for an existing tag.
#
# One-time setup: npm accepts a trusted publisher only for a package that already exists, so
# publish 0.1.0 once from a maintainer machine. Then link this workflow to the package:
#   npm trust github nx-orval --file release.yml --repo artnikbrothers/nx-orval --env npm --allow-publish
# Optionally add required reviewers to the `npm` environment to gate every publish.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v0.1.0
        type: string
        required: true
      dry-run:
        description: Build and pack without publishing
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
    steps:
      - name: Check the tag name
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Not a release tag: $RELEASE_TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "$RELEASE_TAG is not reachable from main" >&2
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships npm 10.
      - run: npm install --global npm@^11.5.1

      - run: npm ci

      - run: npx nx run-many -t lint test build -p nx-orval

      # The source package.json keeps its version; the release version comes from the tag.
      - name: Set the version of the built package
        working-directory: dist/packages/nx-orval
        run: npm pkg set version="${RELEASE_TAG#v}"

      - name: Check the package contents
        run: node .github/scripts/check-package.mjs dist/packages/nx-orval

      - name: Publish
        working-directory: dist/packages/nx-orval
        run: |
          name="$(node -p "require('./package.json').name")"
          # A rerun after a partial failure, or a release that was published by hand, is not an error.
          if npm view "$name@${RELEASE_TAG#v}" version > /dev/null 2>&1; then
            echo "$name@${RELEASE_TAG#v} is already on npm, nothing to publish"
            exit 0
          fi
          args=(--provenance --access public)
          # Prereleases go to the next tag so `npm i nx-orval` keeps resolving the last stable version.
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--tag next); fi
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          npm publish "${args[@]}"
