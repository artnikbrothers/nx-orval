name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npx nx run-many -t lint test build -p nx-orval

      # The root README is the GitHub landing page, the package README is the npm page.
      - name: READMEs are identical
        run: cmp README.md packages/nx-orval/README.md

      - name: Package contents
        run: node .github/scripts/check-package.mjs dist/packages/nx-orval

  # The plugin itself supports Node 20.19; Orval 8 needs Node 22.18, so the e2e below runs on newer Node.
  unit-node20:
    name: Unit tests (Node 20.19)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.19.x
          cache: npm

      - run: npm ci

      - run: npx nx test nx-orval

  e2e:
    name: e2e (Nx ${{ matrix.nx }}, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - nx: 22.7.12
            node: 22
          - nx: 24.0.1
            node: 24
    env:
      NX_ORVAL_E2E_NX_VERSION: ${{ matrix.nx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npx nx e2e nx-orval-e2e
