version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Nx packages move together, so they land in one pull request.
      nx:
        patterns: ['nx', '@nx/*', 'create-nx-workspace']
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
